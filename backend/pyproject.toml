[tool.poetry]
name = "music-suite-backend"
version = "0.1.0"
description = "Spotify playlist management API"
authors = ["Rahul A <rahula@rapyd.net>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = { extras = ["standard"], version = "^0.115" }
httpx = "^0.27"
pandas = "^2.2"
rapidfuzz = "^3.10"
pydantic-settings = "^2.6"
python-dotenv = "^1.0"
itsdangerous = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-mock = "^3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
